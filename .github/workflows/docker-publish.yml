name: Docker Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: devidian/rw-manager-frontend

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - name: Derive version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW_VERSION="${RELEASE_TAG#v}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="$INPUT_VERSION"
          fi
          if [ -z "$RAW_VERSION" ]; then
            echo "Version could not be determined" >&2
            exit 1
          fi
          MAJOR="$(echo "$RAW_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$RAW_VERSION" | cut -d. -f1-2)"
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.architecture }} image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create and push multi-architecture manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR: ${{ needs.prepare.outputs.major }}
          MINOR: ${{ needs.prepare.outputs.minor }}
        run: |
          TAGS="-t $IMAGE_NAME:$VERSION"
          if [[ "$VERSION" != *-* ]]; then
            TAGS="$TAGS -t $IMAGE_NAME:$MINOR -t $IMAGE_NAME:$MAJOR -t $IMAGE_NAME:latest"
          fi
          DIGESTS="$(printf "$IMAGE_NAME@sha256:%s " $(basename -a "${{ runner.temp }}/digests"/*))"
          docker buildx imagetools create $TAGS $DIGESTS
